[package]
name = "noteful-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Goodnotes and Notability notes made into Noteful notes NoteComplete edits"

[dependencies]
noteful-core = { path = "../noteful-core" }
serde_json.workspace = true
base64 = "0.22"
flate2 = "1"
pdf-writer = "0.15.0"
# The Goodnotes and Notability readers (MIT, Coobyk): pinned, see crates/noteful-import/THIRD_PARTY.md.
oblyx = { git = "https://github.com/Coobyk/oblyx", rev = "bf005d5d6d16ccf116b6766a5ea31a387b6305cf", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Edit PDF mode (src/pdf_edit.rs); the same version oblyx uses, so nothing new is built.
lopdf = { version = "0.45", default-features = false }
# Rnote (src/rnote.rs): bitmaps as JPEG/PNG, SVG pictures (imported PDF pages) as vector PDF.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
svg2pdf = { version = "0.13", default-features = false, features = ["image"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
