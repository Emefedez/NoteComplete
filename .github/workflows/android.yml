name: Android APK
on:
  workflow_dispatch:
    inputs:
      reader_url:
        description: 'Optional HTTPS URL of a hosted reader; leave empty to bundle the reader in the APK'
        type: string
        required: false
  workflow_call:
    inputs:
      reader_url:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_READER_URL: ${{ inputs.reader_url || vars.READER_URL }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundled reader
        working-directory: .
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked --root work/wasm-tools
          python tools/build_web.py
          node --test apps/reader/*.test.mjs
          node apps/reader/test.mjs
          node apps/desktop/stage.mjs
      - name: Validate optional hosted reader
        if: env.EXPO_PUBLIC_READER_URL != ''
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.EXPO_PUBLIC_READER_URL);
            if (url.protocol !== "https:" || url.username || url.password || ["localhost", "127.0.0.1", "[::1]"].includes(url.hostname)) throw Error("Use a reachable HTTPS reader URL without credentials.");
          '
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Record APK signing certificate
        run: keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android
      - name: Build standalone preview APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Explain artifact
        run: |
          echo '### Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release-mode preview, signed with the Expo template debug key. Includes the React Native bundle and the reader/WASM assets, served on loopback; no Metro or hosted reader required unless reader_url was set. Not a Play Store release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NoteComplete-android-preview
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
