name: Desktop packages
on:
  # Default targets: Linux x64 and arm64, macOS Apple Silicon, Windows x64. Intel Macs are no
  # longer built by default (releases skip them); tick the box on a manual run to build one.
  workflow_dispatch:
    inputs:
      intel_mac:
        description: Also build for Intel Mac (macOS x64)
        type: boolean
        default: false
  workflow_call:
    inputs:
      intel_mac:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/reader/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --root work/wasm-tools
      - run: python tools/build_web.py
      # The sharing server's packages (ws, yjs); Electron itself is not needed for the tests.
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - run: node --test apps/reader/*.test.mjs apps/reader/chinese/*.test.mjs apps/reader/prefabs/*/test/*.test.mjs apps/desktop/*.test.mjs
      - run: node apps/reader/test.mjs
      - run: node apps/desktop/stage.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-reader-assets
          path: apps/desktop/reader/
          if-no-files-found: error
          retention-days: 7
  # The package matrix: the default targets, plus the optional ones asked for.
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          INTEL_MAC: ${{ inputs.intel_mac }}
        run: |
          set -euo pipefail
          targets='{"os":"ubuntu-24.04","platform":"linux","arch":"x64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"},{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"windows-2022","platform":"win","arch":"x64"}'
          if [ "$INTEL_MAC" = true ]; then targets="$targets"',{"os":"macos-15","platform":"mac","arch":"x64"}'; fi
          echo "matrix={\"include\":[$targets]}" >> "$GITHUB_OUTPUT"
  package:
    needs: [reader, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: desktop-reader-assets
          path: apps/desktop/reader
      - name: Configure Desktop Google OAuth client
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: node tools/configure_desktop_oauth.mjs
      # The app ships the note server (noteful mcp) for the user's AI tools.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the bundled note server
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = mac ] && [ "${{ matrix.arch }}" = x64 ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --locked -p noteful-cli --target x86_64-apple-darwin
            mkdir -p target/release
            cp target/x86_64-apple-darwin/release/noteful target/release/noteful
          else
            cargo build --release --locked -p noteful-cli
          fi
          ls target/release/noteful*
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: apps/desktop
      # zstd behind AppImage's type2 runtime starts ~0.8 s faster than electron-builder's gzip image.
      - name: Repack the AppImage with zstd
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          python3 tools/repack_appimage.py apps/desktop/dist/*.AppImage --arch ${{ matrix.arch }}
      - name: Verify packaged macOS signatures
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          archive=(apps/desktop/dist/*.zip)
          test "${#archive[@]}" -eq 1
          extracted="$RUNNER_TEMP/notecomplete-signature-check"
          ditto -x -k "${archive[0]}" "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/NoteComplete.app"
      - uses: actions/upload-artifact@v4
        with:
          name: NoteComplete-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
