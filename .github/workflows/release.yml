name: Release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish (select that same tag in Run workflow)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != v* ]]; then
            echo 'Select an existing v* tag, not a branch, when dispatching a release.' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo 'The requested tag must match the workflow ref.' >&2
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    secrets: inherit
  publish:
    needs: [validate, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NoteComplete-*
          merge-multiple: true
          path: release-assets
      - name: Prepare assets and checksums
        run: |
          mv release-assets/app-release.apk release-assets/NoteComplete-android.apk
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          sha256sum ./*.apk ./*.AppImage ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt
      - name: Attach all installers to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "NoteComplete $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
