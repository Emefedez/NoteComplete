name: Release installers
# Releases happen by themselves: every push to main reads the version in
# apps/desktop/package.json, and when v<version> has no release yet, every package is built
# and published to a new release (the tag is created at that commit only when all builds pass,
# so a failed build is retried by the next push). A pushed v* tag or a manual run still works.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish (select that same tag in Run workflow)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push to main: release the version in package.json unless it already has a release.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            version=$(node -p "require('./apps/desktop/package.json').version")
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released; bump apps/desktop/package.json to release again."
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Releasing $tag from $GITHUB_SHA."
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != v* ]]; then
            echo 'Select an existing v* tag, not a branch, when dispatching a release.' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo 'The requested tag must match the workflow ref.' >&2
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
  android:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    uses: ./.github/workflows/android.yml
    secrets: inherit
  publish:
    needs: [validate, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NoteComplete-*
          merge-multiple: true
          path: release-assets
      - name: Prepare assets and checksums
        run: |
          mv release-assets/app-release.apk release-assets/NoteComplete-android.apk
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          sha256sum ./*.apk ./*.AppImage ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt
      - name: Attach all installers to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # From main the tag does not exist yet: it is created here, at the commit just built.
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
            gh release create "$RELEASE_TAG" "${where[@]}" --draft --title "NoteComplete $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          # Published as the latest release (not a pre-release): the site and the README link to
          # releases/latest, which skips pre-releases and so stayed on the last one that was not.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
