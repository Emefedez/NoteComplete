name: Portable core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check -p noteful-core --locked --target aarch64-linux-android
  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check -p noteful-core --locked --target aarch64-apple-ios
  webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --root work/wasm-tools
      - run: python tools/build_web.py
      - run: node apps/reader/test.mjs
      - run: node --test apps/reader/*.test.mjs apps/desktop/*.test.mjs

  expo-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run check
        working-directory: apps/mobile
      - run: node --test apps/mobile/*.test.mjs apps/reader/ink-timeline.test.mjs apps/reader/chrome-state.test.mjs apps/reader/selection-geometry.test.mjs apps/reader/selection.test.mjs apps/reader/download.test.mjs apps/reader/import.test.mjs apps/reader/media-import.test.mjs tools/serve_web.test.mjs
      - run: npm run export
        working-directory: apps/mobile
