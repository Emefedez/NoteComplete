<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="NoteComplete" />
<!-- The reader each tab opens; the website build points this at app.html. -->
<meta name="notecomplete-reader" content="./index.html" />
<!-- Copied from tools/reader-csp.mjs (node tools/reader-csp.mjs prints it); a test keeps them equal. Delete this meta tag to switch the policy off. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://accounts.google.com/gsi/client 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' data: blob: https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data: blob:; connect-src 'self' https: wss: ws: data: blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'" />
<title>NoteComplete</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f7; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #15181e; } }
  #tabs { position: fixed; inset: 0; }
  #tabs iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #tabs iframe[hidden] { display: none; }
</style>
<div id="tabs"></div>
<script type="module" src="./tabs-main.js"></script>
